<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed | AL Luxe</title>

    <link rel="stylesheet" href="../src/style.css">

    

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="confirmation-header">

    <div class="logo">
        <h2>AL Luxe</h2>
    </div>


    <nav>

        <ul>

            <li>
                <a href="index.html">HOME</a>
            </li>

            <li>
                <a href="collections.html">COLLECTIONS</a>
            </li>

            <li>
                <a href="wishlist.html">
                    <i class="fa-regular fa-heart"></i>
                </a>
            </li>

            <li>
                <a href="cart.html">
                    <i class="fa-solid fa-bag-shopping"></i>
                </a>
            </li>

        </ul>

    </nav>

</header>



<!-- =========================================
     CONFIRMATION PAGE
========================================= -->

<main class="confirmation-page">


    <section class="confirmation-card">


        <!-- SUCCESS ICON -->

        <div class="success-icon">

            <i class="fa-solid fa-check"></i>

        </div>



        <!-- MESSAGE -->

        <h1>
            Thank You For Your Order
        </h1>


        <p class="confirmation-message">

            Your order has been successfully received.

            <br>

            We appreciate you choosing AL Luxe.

        </p>



        <!-- ORDER NUMBER -->

        <div class="order-number">

            <span>
                Order Number
            </span>

            <strong id="orderNumber">
                AL000000
            </strong>

        </div>



        <!-- CUSTOMER DETAILS -->

        <div class="confirmation-details">


            <div class="detail-box">

                <h3>
                    Delivery Information
                </h3>

                <p id="customerName"></p>

                <p id="customerPhone"></p>

                <p id="customerEmail"></p>

                <p id="customerAddress"></p>

                <p id="customerRegion"></p>

            </div>



            <div class="detail-box">

                <h3>
                    Payment Method
                </h3>

                <p id="paymentMethod"></p>

            </div>


        </div>



        <!-- ORDER ITEMS -->

        <div class="confirmed-items-section">

            <h2>
                Your Order
            </h2>


            <div
                id="confirmedItems"
                class="confirmed-items">

            </div>

        </div>



        <!-- TOTAL -->

        <div class="confirmed-total">

            <span>
                Total
            </span>

            <strong id="confirmedTotal">
                GH₵0.00
            </strong>

        </div>



        <!-- BUTTONS -->

        <div class="confirmation-buttons">

            <a
                href="collections.html"
                class="shop-btn">

                Continue Shopping

            </a>


            <a
                href="../index.html"
                class="home-btn">

                Back To Home

            </a>

        </div>


    </section>


</main>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script src="../src/script.js"></script>


</body>

</html>
