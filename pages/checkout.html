<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | AL Luxe</title>

    <link rel="stylesheet" href="../src/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="checkout-header">

    <div class="logo">
        <h2>AL Luxe</h2>
    </div>


    <nav>

        <ul>

            <li>
                <a href="index.html">HOME</a>
            </li>

            <li>
                <a href="collections.html">COLLECTIONS</a>
            </li>

            <li>
                <a href="wishlist.html">
                    <i class="fa-regular fa-heart"></i>
                </a>
            </li>

            <li>
                <a href="cart.html">
                    <i class="fa-solid fa-bag-shopping"></i>
                </a>
            </li>

        </ul>

    </nav>

</header>



<!-- =========================================
     CHECKOUT PAGE
========================================= -->

<main class="checkout-page">


    <div class="checkout-title">

        <h1>CHECKOUT</h1>

        <p>
            Complete your details to place your AL Luxe order.
        </p>

    </div>



    <section class="checkout-container">


        <!-- =====================================
             CUSTOMER INFORMATION
        ====================================== -->

        <div class="checkout-form-section">


            <h2>Delivery Information</h2>


            <form id="checkoutForm">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required>

                </div>



                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="e.g. 024 000 0000"
                        required>

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required>

                </div>



                <!-- REGION -->

                <div class="form-group">

                    <label for="region">
                        Region
                    </label>

                    <select
                        id="region"
                        name="region"
                        required>

                        <option value="">
                            Select your region
                        </option>

                        <option>
                            Greater Accra
                        </option>

                        <option>
                            Ashanti
                        </option>

                        <option>
                            Central
                        </option>

                        <option>
                            Eastern
                        </option>

                        <option>
                            Western
                        </option>

                        <option>
                            Western North
                        </option>

                        <option>
                            Volta
                        </option>

                        <option>
                            Oti
                        </option>

                        <option>
                            Northern
                        </option>

                        <option>
                            Savannah
                        </option>

                        <option>
                            North East
                        </option>

                        <option>
                            Upper East
                        </option>

                        <option>
                            Upper West
                        </option>

                        <option>
                            Bono
                        </option>

                        <option>
                            Bono East
                        </option>

                        <option>
                            Ahafo
                        </option>

                    </select>

                </div>



                <!-- CITY -->

                <div class="form-group">

                    <label for="city">
                        City / Town
                    </label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter your city or town"
                        required>

                </div>



                <!-- DELIVERY ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        placeholder="Enter your complete delivery address"
                        required></textarea>

                </div>



                <!-- DELIVERY NOTES -->

                <div class="form-group">

                    <label for="notes">
                        Delivery Notes
                        <span>(Optional)</span>
                    </label>

                    <textarea
                        id="notes"
                        name="notes"
                        rows="3"
                        placeholder="Any additional delivery instructions?"></textarea>

                </div>



                <!-- PAYMENT -->

                <h2 class="payment-heading">
                    Payment Method
                </h2>


                <div class="payment-options">


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="mobile-money"
                            required>

                        <span>
                            <i class="fa-solid fa-mobile-screen-button"></i>
                            Mobile Money
                        </span>

                    </label>



                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="cash">

                        <span>
                            <i class="fa-solid fa-money-bill"></i>
                            Cash on Delivery
                        </span>

                    </label>



                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="card">

                        <span>
                            <i class="fa-regular fa-credit-card"></i>
                            Card Payment
                        </span>

                    </label>

                </div>



                <button
                    type="submit"
                    class="place-order-btn">

                    Place Order

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


            </form>

        </div>



        <!-- =====================================
             ORDER SUMMARY
        ====================================== -->

        <aside class="checkout-summary">


            <h2>Your Order</h2>


            <!-- PRODUCTS WILL APPEAR HERE -->

            <div
                id="checkoutItems"
                class="checkout-items">

            </div>



            <div class="checkout-divider"></div>



            <!-- SUBTOTAL -->

            <div class="checkout-row">

                <span>Subtotal</span>

                <strong id="checkoutSubtotal">
                    GH₵0.00
                </strong>

            </div>



            <!-- DELIVERY -->

            <div class="checkout-row">

                <span>Delivery</span>

                <strong>
                    Free
                </strong>

            </div>



            <div class="checkout-divider"></div>



            <!-- TOTAL -->

            <div class="checkout-total">

                <span>Total</span>

                <strong id="checkoutTotal">
                    GH₵0.00
                </strong>

            </div>



            <div class="secure-checkout">

                <i class="fa-solid fa-lock"></i>

                <span>
                    Secure checkout
                </span>

            </div>


        </aside>


    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script src="../src/email.js"></script>

    <script src="../src/script.js"></script>
</body>

</html>
